# SAMPLE, not configuration. Copy what you need into a real config
# file on the discovery chain; this file is never read automatically.
#
#   user layer:     ~/.config/routellm/config.yaml
#   project layer:  ./.routellm.yaml   (gitignored)
#   one-off run:    --config <path>
#
# Run `python -m routellm.config paths` to see the chain.
#
sw_ranking:
    arena_battle_datasets:
      - lmsys/lmsys-arena-human-preference-55k
      - routellm/gpt4_judge_battles
    arena_embedding_datasets:
      - routellm/arena_battles_embeddings
      - routellm/gpt4_judge_battles_embeddings
causal_llm:
    checkpoint_path: routellm/causal_llm_gpt4_augmented
bert:
    checkpoint_path: routellm/bert_gpt4_augmented
mf:
    checkpoint_path: routellm/mf_gpt4_augmented

# Response cache. Off unless enabled: it answers from disk instead of
# calling the model, which is wrong for most conversational traffic. The
# key covers the whole request -- every message (images and tool calls
# included), tools and sampling params -- so only an identical request
# hits. Stream requests are never cached. The database holds prompts and
# completions in plaintext and is created owner-only (0600). A relative
# `db_path` resolves against this file's directory.
cache:
  enabled: false
  db_path: .routellm_cache.db
  ttl_seconds: 86400

# Retries, timeout and circuit breaker for every upstream call. The
# defaults are shown. `timeout_ms` bounds one attempt; a slow local
# model needs more. An endpoint may override it with its own
# `timeout_ms:`. An `openai/` endpoint also retries inside the SDK, so
# set `extra: {max_retries: 0}` there to keep the count honest.
resilience:
  timeout_ms: 30000
  max_retries: 3
  retry_on_codes: [429, 500, 502, 503, 504]
  initial_backoff_ms: 500
  backoff_factor: 2.0
  cb_enabled: true
  cb_fail_max: 5
  cb_fail_rate: 0.5
  cb_fail_wait_ms: 5000
  cb_rate_interval_ms: 60000
  cb_rate_minimum: 10
  # A timeout is retried; the abandoned attempt may still run upstream,
  # so a paid endpoint can bill both. Set false to not retry timeouts.
  retry_on_timeout: true
  # Rate-limit cooldown, off by default. When on, a 429 is not retried in
  # place: the endpoint cools until the reset its error states (any header
  # named below, or the body's metadata.headers), else the default, and
  # the walk moves to the next candidate, skipping cooling endpoints
  # without a call. A daily-quota message (any marker below) cools for
  # `rate_limit_daily_cooldown_s` when no reset is stated. Nothing cools
  # longer than the max. A 429 here does not count toward the breaker.
  rate_limit_cooldown: false
  rate_limit_default_cooldown_s: 60
  rate_limit_daily_cooldown_s: 3600
  rate_limit_max_cooldown_s: 86400
  rate_limit_reset_headers: [retry-after, x-ratelimit-reset]
  rate_limit_daily_markers: [per-day, per day, daily]

# Transcribe-then-route: turn audio parts into text before routing, so a
# text-only tier can answer a request that carries audio. Point it at any
# OpenAI `/v1/audio/transcriptions`-compatible service. Omit this section
# (or set `mode: passthrough`) to route audio to an audio-capable
# endpoint instead. A tier may override any key under its own
# `transcriber:`. `segments[].speaker` is used when the service sends it
# and omitted when it does not. A tier whose endpoints are all tagged
# `local` must use a transcriber tagged `local`, or the config is
# rejected. `audio_url` parts are refused unless `allow_urls: true` and the
# host is in `allowed_url_hosts`, and must resolve to public addresses.
# Commented out: the sample should send audio nowhere by default.
#
# transcriber:
#   mode: transcribe
#   api_base: http://127.0.0.1:9000/v1
#   api_key_env: TRANSCRIBER_API_KEY
#   model: whisper-1
#   timeout_ms: 60000
#   max_audio_bytes: 26214400
#   language: null          # per request: X-RouteLLM-Transcribe-Language header
#   format: "[{start}-{end}] {speaker}: {text}"
#   format_no_speaker: "[{start}-{end}] {text}"
#   allow_urls: false
#   allowed_url_hosts: []            # with allow_urls: exact hostnames; empty refuses all
#   allow_private_url_hosts: false   # DANGEROUS: allows non-public addresses (SSRF)
#   tags: [local]

# Named endpoints. Each gives a reachable model a stable name that
# routing, caching, and traces refer to instead of a raw litellm model
# string. Names match [A-Za-z0-9_]+: hyphens are reserved for the
# model-name grammar. Credentials are never written here; `api_key_env`
# names an environment variable read at call time, so this file loads on
# a machine holding none of the keys.
#
# `pay: true` authorises an endpoint to charge the wallet behind
# `--payment-provider x402`. It is off everywhere by default, and the
# flag supplies a wallet rather than naming anyone allowed to spend it:
# a 402 from an endpoint that did not ask for this is returned unpaid,
# however well-formed the challenge. The authorisation covers that
# endpoint's `api_base` -- its origin and path prefix -- so anything
# else the process talks to stays unpayable even though litellm's HTTP
# session is shared.
endpoints:
  cloud_strong:
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    tags: [cloud, tools]
    quality: 90

  # A metered upstream that answers 402 and is meant to be paid.
  # Commented out: the sample should authorise nothing by default.
  #
  # metered:
  #   model: openai/some-metered-model
  #   api_base: https://metered.example.com/v1
  #   pay: true

  # Ollama over the ssh tunnel. models.dev lists no ollama models, so
  # this endpoint is a tag-only candidate for selectors: it satisfies
  # `tag:` terms and fails every catalog term.
  ollama_qwen:
    model: ollama_chat/qwen3:8b
    api_base: http://127.0.0.1:11500
    tags: [local]
    # Params this endpoint's provider rejects. Unset (as here), the
    # advisory flags an agent client sends -- `parallel_tool_calls`,
    # `reasoning_effort`, `stream_options` -- are dropped when the
    # provider lacks them, so the request is still served. Other
    # unsupported params fail the call. Set `true` to drop anything the
    # provider rejects, `false` to drop nothing, or a list of names to
    # drop those too. Dropped names are logged at DEBUG, never values.
    # drop_params: [logit_bias]

  # A second local OpenAI-compatible server over its own tunnel. The
  # `openai/` prefix routes any OpenAI-compatible server through litellm.
  # The model id must match what the server reports under `/v1/models`;
  # a mismatch is rejected by the server, not by routellm.
  local_glm:
    model: openai/glm-5.2
    api_base: http://127.0.0.1:11800/v1
    api_key_env: LOCAL_GLM_API_KEY
    tags: [local, tools]
    quality: 85

  # An audio-capable local model. Requests carrying `input_audio` parts
  # are served only by an endpoint that declares audio, either directly
  # (`audio: true`) or by listing `audio` in `modalities_in`; undeclared
  # means no, whatever `strict` says. Use the `openai/` route: litellm's
  # native `ollama_chat/` and `ollama/` transports drop audio parts, so
  # routellm treats them as not audio capable.
  local_audio:
    model: openai/<your-audio-model>
    api_base: http://127.0.0.1:11434/v1
    capabilities:
      modalities_in: [text, audio]

  # The `mf` and `sw_ranking` routers embed each prompt before scoring
  # it. This endpoint supplies the base URL and the credential for those
  # calls and nothing else: each router keeps its own `embedding_model`,
  # so the `model` written here is never sent. Without this endpoint the
  # embedding client falls back to OPENAI_BASE_URL / OPENAI_API_KEY.
  embedding:
    model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY

# Tiers: named strong/weak pairs whose sides may themselves be tiers, so
# a request addressed to a tier walks a tree, one router call per level.
# A tier naming no router or threshold inherits them from the level
# above, then from the request, then from the controller defaults.
tiers:
  premium:
    router: mf
    threshold: 0.33
    strong: cloud_strong
    weak: local_glm

  # `default` answers a bare `router-<name>-<threshold>` request, so an
  # existing OpenAI client reaches the tree without changing its model
  # field.
  default:
    router: mf
    threshold: 0.12
    strong: premium
    weak: ollama_qwen

# A side may select rather than name, saying what it wants over endpoint
# tags plus the models.dev catalog; `routellm.pairing` resolves it to one
# endpoint name at startup. Needs the `pairing` extra. Explain a pick
# with `python -m routellm.pairing --config config.yaml`. Commented out:
# the tier above already names both sides.
#
# default_selected:
#   router: mf
#   threshold: 0.12
#   strong: {select: "tool_call:true reasoning:true", order: quality_desc}
#   weak: {select: "tag:local", order: cost_asc}

# `free:true` keeps endpoints the catalog prices at 0 for input and output
# (unpriced or uncatalogued ones are not free). `pool: N` keeps the best N
# matches: the first is the side, the rest are tried after it, before the
# other side, when it fails or is cooling (see `resilience:`). Tag every
# metered gateway endpoint (`cloud`, plus the provider's own label) so a
# `tag:local` selector can never reach it. Commented out.
#
# default_pooled:
#   router: mf
#   threshold: 0.12
#   strong: cloud_strong
#   weak: {select: "tag:gateway free:true", order: quality_desc, pool: 3}

# Every router named above ships with the base package, so this file
# serves on a stock install. `jev` is registered by the typesafe
# extension instead: install it with `pip install -e
# ./extensions/typesafe`, then a tier may route on it. Commented out so
# the example needs no extra.
#
# premium:
#   router: jev
#   threshold: 0.33
#   strong: cloud_strong
#   weak: local_glm

# --- measured quality --------------------------------------------------
# `quality:` on an endpoint above is a number a human typed once. The
# sidecar is the measured one: record traces, score them, aggregate, and
# point at the result. See docs/runbooks/traces-to-quality.md.
#
# The sidecar wins over an endpoint's `quality:`, logging one INFO line
# per override; set `quality_from_override: false` to make an explicit
# `quality:` win instead, with the sidecar filling only endpoints that
# set none. A relative path resolves against this file's directory, and
# the sidecar is read once, at startup.
#
# quality_from: ./quality.yaml
# quality_from_override: true

# An area groups the tiers answering one kind of request, so quality can
# be measured per area and a selector inside such a tier orders on its
# area's number before the overall one. A tier in no area is unaffected;
# a tier in two is a load error.
#
# areas:
#   coding:      [coding, coding_quality, coding_fast]
#   copywriting: [copywriting, copywriting_quality, copywriting_fast]
