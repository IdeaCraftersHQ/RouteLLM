# SAMPLE, not configuration. Copy what you need into a real config
# file on the discovery chain; this file is never read automatically.
#
#   user layer:     ~/.config/routellm/config.yaml
#   project layer:  ./.routellm.yaml   (gitignored)
#   one-off run:    --config <path>
#
# Run `python -m routellm.config paths` to see the chain.
#
sw_ranking:
    arena_battle_datasets:
      - lmsys/lmsys-arena-human-preference-55k
      - routellm/gpt4_judge_battles
    arena_embedding_datasets:
      - routellm/arena_battles_embeddings
      - routellm/gpt4_judge_battles_embeddings
causal_llm:
    checkpoint_path: routellm/causal_llm_gpt4_augmented
bert:
    checkpoint_path: routellm/bert_gpt4_augmented
mf:
    checkpoint_path: routellm/mf_gpt4_augmented

# Caller identity. Off unless this section exists: the server then stays
# unauthenticated, bound to loopback by default. With `keys_file` set,
# every route except /health needs `Authorization: Bearer <key>`; a
# missing or unknown key is a 401. The file holds sha256 hashes, never
# keys (an entry with a clear-text `key` stops startup):
#
#   keys:
#     - key_sha256: "<printf %s "$KEY" | shasum -a 256>"
#       principal: team-a              # name audit and cache key on
#       profile: default               # optional
#       allowed_classes: [public]      # data classes this caller may send;
#                                      # unused when a `policy:` is loaded (its
#                                      # `principals` decides)
#
# A relative path resolves against this file's directory. Keep the file
# owner-only (0600). The matched caller is on `request.state.principal`.
# auth:
#   keys_file: keys.yaml

# Response cache. Off unless enabled: it answers from disk instead of
# calling the model, which is wrong for most conversational traffic. The
# key covers the whole request -- every message (images and tool calls
# included), tools and sampling params -- so only an identical request
# hits. Stream requests are never cached. The database holds prompts and
# completions in plaintext and is created owner-only (0600). A relative
# `db_path` resolves against this file's directory.
cache:
  enabled: false
  db_path: .routellm_cache.db
  ttl_seconds: 86400

# Retries, timeout and circuit breaker for every upstream call. The
# defaults are shown. `timeout_ms` bounds one attempt; a slow local
# model needs more. An endpoint may override it with its own
# `timeout_ms:`. An `openai/` endpoint also retries inside the SDK, so
# set `extra: {max_retries: 0}` there to keep the count honest.
resilience:
  timeout_ms: 30000
  max_retries: 3
  retry_on_codes: [429, 500, 502, 503, 504]
  initial_backoff_ms: 500
  backoff_factor: 2.0
  cb_enabled: true
  cb_fail_max: 5
  cb_fail_rate: 0.5
  cb_fail_wait_ms: 5000
  cb_rate_interval_ms: 60000
  cb_rate_minimum: 10
  # A timeout is retried; the abandoned attempt may still run upstream,
  # so a paid endpoint can bill both. Set false to not retry timeouts.
  retry_on_timeout: true
  # Rate-limit cooldown, off by default. When on, a 429 is not retried in
  # place: the endpoint cools until the reset its error states (any header
  # named below, or the body's metadata.headers), else the default, and
  # the walk moves to the next candidate, skipping cooling endpoints
  # without a call. A daily-quota message (any marker below) cools for
  # `rate_limit_daily_cooldown_s` when no reset is stated. Nothing cools
  # longer than the max. A 429 here does not count toward the breaker.
  rate_limit_cooldown: false
  rate_limit_default_cooldown_s: 60
  rate_limit_daily_cooldown_s: 3600
  rate_limit_max_cooldown_s: 86400
  rate_limit_reset_headers: [retry-after, x-ratelimit-reset]
  rate_limit_daily_markers: [per-day, per day, daily]

# Advisory context cost of audio, in tokens per second of audio. The
# token counter cannot count audio, so without this a long clip would add
# nothing to the context estimate and could not be refused for size. A WAV
# is measured from its header; other formats are estimated from byte length
# at conservative bitrates. Default 32 (the high end of published figures).
# With a transcriber in `mode: transcribe` only the transcript is counted.
audio_tokens_per_second: 32

# Transcribe-then-route: turn audio parts into text before routing, so a
# text-only tier can answer a request that carries audio. Point it at any
# OpenAI `/v1/audio/transcriptions`-compatible service. Omit this section
# (or set `mode: passthrough`) to route audio to an audio-capable
# endpoint instead. A tier may override any key under its own
# `transcriber:`. `segments[].speaker` is used when the service sends it
# and omitted when it does not. A tier whose endpoints are all tagged
# `local` must use a transcriber tagged `local`, or the config is
# rejected. `audio_url` parts are refused unless `allow_urls: true` and the
# host is in `allowed_url_hosts`, and must resolve to public addresses.
# Commented out: the sample should send audio nowhere by default.
#
# transcriber:
#   mode: transcribe
#   api_base: http://127.0.0.1:9000/v1
#   api_key_env: TRANSCRIBER_API_KEY
#   model: whisper-1
#   timeout_ms: 60000
#   max_audio_bytes: 26214400
#   language: null          # per request: X-RouteLLM-Transcribe-Language header
#   format: "[{start}-{end}] {speaker}: {text}"
#   format_no_speaker: "[{start}-{end}] {text}"
#   allow_urls: false
#   allowed_url_hosts: []            # with allow_urls: exact hostnames; empty refuses all
#   allow_private_url_hosts: false   # DANGEROUS: allows non-public addresses (SSRF)
#   tags: [local]

# Governance tags (optional). Tags are free-form, but `<ns>:<value>`
# tags need a known namespace: `jur` is built in (at most one per
# endpoint, lowercase ISO 3166-1 alpha-2, e.g. `jur:ca`); add more here.
# Reach is the subset of local / vpn / cloud an endpoint carries.
# `governance: true` makes every endpoint carry a reach tag and exactly
# one `jur:` tag. Off by default.
# tag_namespaces: [team]
# governance: true

# `policy: <path>` loads a policy file (see README, "Policy file"): data
# classes mapped to reach, jurisdiction, entry tiers and treatment, deny
# by default. Loading one turns on `governance` and `strict_registry`.
# A relative path resolves against the config file that sets it.
# policy: /etc/routellm/policy.yaml
#
# Example policy file:
#   default_class: null            # null: a request with no class is refused
#   classes:
#     public:
#       treatment: raw             # raw | redact | block | vault
#       reach: [local, vpn, cloud]
#       tiers: [default]
#     internal:
#       treatment: block           # never cloud
#       reach: [local, vpn]
#       jur: [ca]                  # empty = any jurisdiction
#       tiers: [private]
#       cache: none                # none | exact | both
#     sealed:
#       treatment: vault           # every request refused, no model call
#   principals:
#     analyst: {classes: [public, internal]}
#
# `tiers:` is the class's allowed entry tiers. A request addressing another
# tier is a 403 naming class and tier. At startup every leaf reachable from
# those tiers (both sides, nested tiers, fallback sibling, pool members,
# traffic rules, canary, load balancer targets) must fit the class's `reach`
# and `jur`, or the server refuses to start and lists class, tier, leaf, tag.
#
# Callers declare `X-Data-Class` / `X-Operation` headers or body
# `metadata: {data_class, operation}` (never forwarded; see README,
# "Request data class and operation"). With a policy, every principal it
# names needs a key in `auth.keys_file`, and `auth:` must be on.

# `strict_registry: true` (or `--strict-registry`) refuses every model
# name that is not an endpoint below: raw --strong-model/--weak-model
# values, the legacy default pair, and raw targets in traffic rules,
# canary and load balancers fail at startup; an unknown name never
# reaches litellm. Off by default.
# strict_registry: true

# Named endpoints. Each gives a reachable model a stable name that
# routing, caching, and traces refer to instead of a raw litellm model
# string. Names match [A-Za-z0-9_]+: hyphens are reserved for the
# model-name grammar. Credentials are never written here; `api_key_env`
# names an environment variable read at call time, so this file loads on
# a machine holding none of the keys.
#
# `pay: true` authorises an endpoint to charge the wallet behind
# `--payment-provider x402`. It is off everywhere by default, and the
# flag supplies a wallet rather than naming anyone allowed to spend it:
# a 402 from an endpoint that did not ask for this is returned unpaid,
# however well-formed the challenge. The authorisation covers that
# endpoint's `api_base` -- its origin and path prefix -- so anything
# else the process talks to stays unpayable even though litellm's HTTP
# session is shared.
endpoints:
  cloud_strong:
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    tags: [cloud, tools]
    quality: 90

  # A metered upstream that answers 402 and is meant to be paid.
  # Commented out: the sample should authorise nothing by default.
  #
  # metered:
  #   model: openai/some-metered-model
  #   api_base: https://metered.example.com/v1
  #   pay: true

  # Ollama over the ssh tunnel. models.dev lists no ollama models, so
  # this endpoint is a tag-only candidate for selectors: it satisfies
  # `tag:` terms and fails every catalog term.
  ollama_qwen:
    model: ollama_chat/qwen3:8b
    api_base: http://127.0.0.1:11500
    tags: [local]
    # Params this endpoint's provider rejects. Unset (as here), the
    # advisory flags an agent client sends -- `parallel_tool_calls`,
    # `reasoning_effort`, `stream_options` -- are dropped when the
    # provider lacks them, so the request is still served. Other
    # unsupported params fail the call. Set `true` to drop anything the
    # provider rejects, `false` to drop nothing, or a list of names to
    # drop those too. Dropped names are logged at DEBUG, never values.
    # drop_params: [logit_bias]

  # A second local OpenAI-compatible server over its own tunnel. The
  # `openai/` prefix routes any OpenAI-compatible server through litellm.
  # The model id must match what the server reports under `/v1/models`;
  # a mismatch is rejected by the server, not by routellm.
  local_glm:
    model: openai/glm-5.2
    api_base: http://127.0.0.1:11800/v1
    api_key_env: LOCAL_GLM_API_KEY
    tags: [local, tools]
    quality: 85

  # An audio-capable local model. Requests carrying `input_audio` parts
  # are served only by an endpoint that declares audio, either directly
  # (`audio: true`) or by listing `audio` in `modalities_in`; undeclared
  # means no, whatever `strict` says. Use the `openai/` route: litellm's
  # native `ollama_chat/` and `ollama/` transports drop audio parts, so
  # routellm treats them as not audio capable.
  local_audio:
    model: openai/<your-audio-model>
    api_base: http://127.0.0.1:11434/v1
    capabilities:
      modalities_in: [text, audio]

  # One config for several hosts: take the URL from the environment.
  # `${VAR}` is required (an unset variable fails the load, naming the
  # key), `${VAR:-default}` falls back, `${VAR:?message}` fails with your
  # message, `$$` is a literal `$`. A bare `$NAME` is left alone. Only
  # string values are expanded, never keys. Never put a secret here: keys
  # stay in `api_key_env`. An endpoint tagged `local` must set `api_base`
  # naming a loopback, private, link-local, `.local`, `.internal` or
  # `.localhost` host, so it can never fall back to or reach a public
  # provider. `allow_public_base: true` lifts that check; it is dangerous.
  local_box:
    model: openai/<your-model>
    api_base: ${ROUTE_LOCAL_BASE:-http://127.0.0.1:11434/v1}
    tags: [local]

  # The `mf` and `sw_ranking` routers embed each prompt before scoring
  # it. This endpoint supplies the base URL and the credential for those
  # calls and nothing else: each router keeps its own `embedding_model`,
  # so the `model` written here is never sent. Without this endpoint the
  # embedding client falls back to OPENAI_BASE_URL / OPENAI_API_KEY.
  embedding:
    model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY

# Intent detection (optional; off unless `model` is set). It picks a
# tier from the prompt. `model` must name an endpoint above: there is
# no default model and a raw litellm name is a startup error. With
# `detector: jev`, `upstream` names the endpoint whose `api_base` is the
# Jev host, and a `jev` router needs `jev: {upstream: <endpoint>}`.
# intents:
#   detector: litellm          # or jev
#   model: local_fast          # registry endpoint that classifies
#   descriptions:
#     code: writing or debugging software
#   tiers:
#     code: default

# Decision step (optional; off without it). Labels each request with a
# data class, an intent and an optional area, using a registry endpoint;
# `require_tags` makes the load fail unless that endpoint carries them,
# which is how a deployment forces a local decision model. Classes are
# ordered least to most restrictive. Failures resolve through `on_error`.
# decision:
#   provider: llm
#   endpoint: local_box
#   require_tags: [local]
#   data_classes:
#     general: nothing sensitive
#     private: personal or secret data
#   intents:
#     code: writing or debugging software
#     chat: small talk
#   input: {messages: last_user, max_chars: 4000}
#   timeout_ms: 2000
#   min_confidence: 0.6
#   on_error: most_restrictive
#   recognizers:
#     - {name: key_material, type: regex, class: private, patterns: ['-----BEGIN [A-Z ]*PRIVATE KEY-----']}
#   sticky: {enabled: true, ttl_s: 3600}

# Egress gates (optional; need `policy:` for the class rules). A gate holds
# back endpoints carrying a tag: before any call, a class in `deny_classes`
# never reaches them (tier side, forced side, fallback, pool, shadow,
# compare, intent detector). At load every selected endpoint's model id,
# and each id under `also_check`, must pass `models` or startup fails.
# `deny` wins over `allow`; an empty `allow` allows nothing. An allow entry
# may demand params in the endpoint's `extra`. `require_policy_allow` admits
# a gated endpoint only when the request's routing policy (below) lists one
# of its tags in `allow_tags`; without `policy_routing:` it refuses them all.
# egress_gates:
#   - name: gated
#     select: "tag:gated"
#     deny_classes: [internal]
#     models:
#       allow:
#         - "vendor/*"
#         - model: "vendor/free-*"
#           require: {extra_body.provider.data_collection: deny}
#       deny: ["*:legacy"]
#     also_check: [extra_body.models]

# Policy routing (optional; needs `policy:`). Request attributes, read from
# headers, pick a routing policy; its rules pick the tier. A request
# addressed to an `entry` tier goes to the first matching rule's tier, else
# `else`. The effective class is the strictest of the policy's `data_class`,
# the declared class and the decision step's, in the policy file's `classes:`
# order (least restrictive first); nothing lowers it. A policy never widens a
# class: the tier it picks must still be an entry tier of the class, and every
# leaf under it still passes the class, `deny_tags` and the egress gates. A
# missing, invalid or unknown `key` value takes `default_policy`. A non-default
# policy named in a header needs the policy file's
# `principals.<name>.projects` to list it (else 403; no auth: default only). Header
# names, classes, intents and tiers below are placeholders. Attribute headers
# are never forwarded upstream.
# policy_routing:
#   attributes:
#     project: {header: X-Route-Project}   # default header: X-Route-<Name>
#     client: {pattern: '^[a-z]{1,16}$'}   # default pattern: ^[a-z0-9][a-z0-9._-]{0,62}$
#   key: project
#   entry: [auto]
#   rules:
#     - {when: {class: private}, tier: private}
#     - {when: {client: codex}, tier: strong}
#     - {when: {intent: hard}, tier: strong}
#   else: balanced
#   default_policy: default
#   policies:
#     default:
#       data_class: general
#       tiers: [balanced, private]
#       fallback: balanced
#     research:                      # a project that may use the strong tier
#       data_class: general
#       tiers: [balanced, strong, private]
#       allow_tags: [metered]        # admitted by a `require_policy_allow` gate
#       deny_tags: []

# Tiers: named strong/weak pairs whose sides may themselves be tiers, so
# a request addressed to a tier walks a tree, one router call per level.
# A tier naming no router or threshold inherits them from the level
# above, then from the request, then from the controller defaults.
tiers:
  premium:
    router: mf
    threshold: 0.33
    strong: cloud_strong
    weak: local_glm

  # `default` answers a bare `router-<name>-<threshold>` request, so an
  # existing OpenAI client reaches the tree without changing its model
  # field.
  default:
    router: mf
    threshold: 0.12
    strong: premium
    weak: ollama_qwen

# A side may select rather than name, saying what it wants over endpoint
# tags plus the models.dev catalog; `routellm.pairing` resolves it to one
# endpoint name at startup. Needs the `pairing` extra. Explain a pick
# with `python -m routellm.pairing --config config.yaml`. Commented out:
# the tier above already names both sides.
#
# default_selected:
#   router: mf
#   threshold: 0.12
#   strong: {select: "tool_call:true reasoning:true", order: quality_desc}
#   weak: {select: "tag:local", order: cost_asc}
#
# `tag:` terms take `!` (must not carry) and `|` (carries at least one):
#   {select: "!tag:cloud"}               anything but cloud
#   {select: "tag:jur:ca|jur:fr"}        either jurisdiction
#   {select: "tag:vpn !tag:jur:fr"}      vpn, not in fr
# `|` alternatives share one namespace or are all reach labels
# (`local|vpn|cloud`); anything else, or an unknown namespace in any
# `tag:` term, fails at startup.

# `free:true` keeps endpoints the catalog prices at 0 for input and output
# (unpriced or uncatalogued ones are not free). `pool: N` keeps the best N
# matches: the first is the side, the rest are tried after it, before the
# other side, when it fails or is cooling (see `resilience:`). Tag every
# metered gateway endpoint (`cloud`, plus the provider's own label) so a
# `tag:local` selector can never reach it. Commented out.
#
# default_pooled:
#   router: mf
#   threshold: 0.12
#   strong: cloud_strong
#   weak: {select: "tag:gateway free:true", order: quality_desc, pool: 3}

# Comparison routing: send a request to 2+ models at once and record TTFT,
# latency, tokens/s, token counts, cost, errors and output per model into
# the trace store. Everything below is off until `enabled: true`.
#   - Shadow: the normal request is answered by its primary, unchanged;
#     shadows run concurrently in the background and are only recorded.
#   - POST /v1/compare returns every model's result side by side
#     (`endpoint: false` turns it off).
#   - Triggers, first match wins: the X-RouteLLM-Compare header (an
#     experiment, a profile, or comma-separated endpoint names), a named
#     experiment sampled at its rate, a per-tier sampling rule.
# A tier whose endpoints are all tagged `local` may only be shadowed to
# `local` endpoints (checked here at load, and per request for the
# header). Endpoints with `pay: true` are never comparison targets.
# Budgets are USD, in memory, per process. Commented out: the sample
# should shadow nothing by default.
#
# comparison:
#   enabled: true
#   endpoint: true             # serve POST /v1/compare
#   allow_header: true         # honour X-RouteLLM-Compare
#   max_concurrency: 4         # shadow calls in flight at once, overall
#   max_models: 4              # most models in one comparison
#   timeout_ms: 60000          # per comparison call; calls are not retried
#   compare_allowed_models: [local_glm]   # /v1/compare without `tier` may name only these
#                                          # (and profile/experiment models)
#   allow_untiered_compare: false  # DANGEROUS if true: any caller may send any
#                                  # prompt to any configured endpoint
#   measure_ttft: false        # stream shadows upstream to time first token
#   budget_usd: 5.00           # stop all comparison calls after this spend
#   profiles:                  # named endpoint lists
#     frontier_vs_local: [cloud_strong, local_glm]
#   sampling:                  # per entered tier
#     default: {rate: 0.05, models: [local_glm]}   # a list or a profile
#   experiments:
#     bench:
#       models: frontier_vs_local
#       rate: 0.1              # ignored when named in the header
#       tiers: [premium]       # optional; omit for every request
#       budget_usd: 1.00
#       max_concurrency: 2
#   judge:                     # optional; any routellm.quality_scores spec
#     scorer: "rubric:rubric.yaml"   # judge:<endpoint> must be `local` for local-only data

# Trace store: one JSON file per request, the input to scoring (see
# docs/runbooks/traces-to-quality.md) and where comparison results land.
# Off unless enabled. By default a trace holds ids, scores, token usage
# and a SHA-256 and length of the prompt and of the output, no text.
# Scoring needs text: set capture_content to store plaintext prompts and
# completions (logs a startup WARNING). Directory 0700, files 0600. A relative `trace_dir` resolves against this file.
#
# traces:
#   enabled: true
#   trace_dir: .routellm_traces
#   max_files: 10000           # 0 is unbounded
#   max_bytes: 536870912       # 0 is unbounded
#   capture_content: false     # true: store prompt and response text

# Every router named above ships with the base package, so this file
# serves on a stock install. `jev` is registered by the typesafe
# extension instead: install it with `pip install -e
# ./extensions/typesafe`, then a tier may route on it. Commented out so
# the example needs no extra.
#
# premium:
#   router: jev
#   threshold: 0.33
#   strong: cloud_strong
#   weak: local_glm

# --- measured quality --------------------------------------------------
# `quality:` on an endpoint above is a number a human typed once. The
# sidecar is the measured one: record traces, score them, aggregate, and
# point at the result. See docs/runbooks/traces-to-quality.md.
#
# The sidecar wins over an endpoint's `quality:`, logging one INFO line
# per override; set `quality_from_override: false` to make an explicit
# `quality:` win instead, with the sidecar filling only endpoints that
# set none. A relative path resolves against this file's directory, and
# the sidecar is read once, at startup.
#
# quality_from: ./quality.yaml
# quality_from_override: true

# An area groups the tiers answering one kind of request, so quality can
# be measured per area and a selector inside such a tier orders on its
# area's number before the overall one. A tier in no area is unaffected;
# a tier in two is a load error.
#
# areas:
#   coding:      [coding, coding_quality, coding_fast]
#   copywriting: [copywriting, copywriting_quality, copywriting_fast]

# --- PII analysis ------------------------------------------------------
# Local detection of personal data, `routellm.redact.analyze(text,
# language)`. Needs the `redact` extra and the spaCy models; see
# docs/redact.md. Both keys are optional.
#
# redact:
#   # Regexes for your own identifiers; each match is a `client_id` span.
#   # A pattern that fails to compile or can match nothing is a load error.
#   client_id_patterns:
#     - 'CLI-\d{6}'
#     - '\bACCT[A-Z]{2}\d{4}\b'
#   # spaCy model per language. These are the defaults.
#   models:
#     fr: fr_core_news_lg
#     en: en_core_web_lg
