[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routellm"
version = "0.2.0"
description = "A framework for serving and evaluating large language model routers."
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
	'pyyaml',
	'pydantic',
	"numpy<2",
	'pandas',
	'torch',
	'scikit-learn',
	'tqdm',
	'openai',
	'transformers',
	'datasets',
	'litellm',
	'x402[evm]>=2.0.0'
]

[project.optional-dependencies]
serve = ["fastapi", "shortuuid", "uvicorn"]
eval = ["matplotlib", "pandarallel", "sglang", 'tiktoken', "psutil"]
dev = [
	"pre-commit",
	"pytest",
	"pytest-asyncio",
	"ruff",
	# Record/replay cassettes for the e2e scenarios. Test-only, and
	# deliberately NOT a core dependency: it requires Python >=3.12
	# while this package supports >=3.11, so putting it in `dependencies`
	# would raise the floor for every consumer to buy a test fixture.
	"hop-top-xrr @ git+https://github.com/hop-top/poly-xrr.git#subdirectory=py",
]
# A direct-URL dependency is rejected by PyPI, so this extra blocks an
# upload of the package. Replace it with a version pin once hop-top-aim
# is published.
pairing = [
	"hop-top-aim @ git+https://github.com/hop-top/poly-aim.git#subdirectory=py",
]
# Only `routellm.quality_scores score` imports fit, and only inside
# `build_scorer`. Aggregation and config consumption never do.
fit = [
	"hop-top-fit @ git+https://github.com/hop-top/fit.git#subdirectory=py",
]

[project.urls]
"Homepage" = "https://github.com/lm-sys/RouteLLM"
"Bug Tracker" = "https://github.com/lm-sys/RouteLLM/issues"

[tool.pytest.ini_options]
markers = [
	"slow: imports the heavy ML stack or spawns a subprocess",
]

[tool.hatch.metadata]
# The `pairing` extra names a git URL. Setuptools allowed it silently;
# hatchling refuses unless this says so. PyPI still rejects such an
# upload, which is what the note on that extra is about.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["routellm"]

[tool.hatch.build.targets.sdist]
exclude = ["assets", "benchmarks", "extensions", "docs", "models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The default rules plus the upgrade, import-hygiene and bugbear sets the
# playbook expects. Judgement-call findings (blind except, subprocess
# without check) are reported but not auto-fixed.
select = ["E", "F", "I", "UP", "B", "RUF", "PL", "BLE"]
ignore = [
	# The suite drives long descriptive test names and tabular fixtures.
	"E501",
	"PLR0912",
	"PLR0913",
	"PLR0915",
	"PLR2004",
	# Heavy and optional dependencies -- torch, the payment SDK, the
	# training stack -- are imported inside the functions that need
	# them, deliberately, so importing routellm stays cheap.
	"PLC0415",
	# The remaining rules below are judgement calls this codebase has
	# not yet worked through. They are listed explicitly so `make lint`
	# is green and a NEW violation is visible, rather than hidden in a
	# backlog of 143. Each should be retired deliberately.
	"BLE001",
	"PLR0917",
	"E402",
	"PLW2901",
	"PLW0603",
	"RUF012",
	# Pandas boolean masks: `== True` is meaningful on a Series and the
	# suggested `if x:` would raise. Not a style choice.
	"E712",
	"RUF059",
	"B017",
	"RUF005",
	"F841",
	"RUF013",
	"B904",
	"B008",
	"PLW0602",
	"RUF001",
	"RUF002",
	"RUF003",
	"B006",
	"PLR0904",
	"PLC0206",
	"PLW1508",
	"PLR1704",
	"E741",
	"E722",
	"B025",
	"B905",
	"F811",
	"PLR0911",
	"RUF015",
	"F401",
	"B007",
	"F402",
	"RUF043",
	"UP042",
	"PLR0914",
	"PLR0916",
	"PLW0642",
	"RUF046",
	"PLC1901",
]

[tool.ruff.lint.per-file-ignores]
# Tests re-export fixtures and assert on constants.
# A property access is the call under test when it must raise.
"routellm/tests/*" = ["PLC0415", "BLE001", "PLW1510", "B018"]
# The fallback loop defines a closure and calls it in the same
# iteration, so late binding never bites; B023 cannot see that.
"routellm/controller.py" = ["B023"]
