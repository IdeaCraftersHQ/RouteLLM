[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "routellm"
version = "0.2.0"
description = "A framework for serving and evaluating large language model routers."
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
	'pyyaml',
	'pydantic',
	"numpy<2",
	'pandas',
	'torch',
	'scikit-learn',
	'tqdm',
	'openai',
	'transformers',
	'datasets',
	'litellm',
	'x402[evm]>=2.0.0'
]

[project.optional-dependencies]
serve = ["fastapi", "shortuuid", "uvicorn"]
eval = ["matplotlib", "pandarallel", "sglang", 'tiktoken', "psutil"]
dev = ["black", "isort", "pre-commit", "pytest", "pytest-asyncio"]

[project.urls]
"Homepage" = "https://github.com/lm-sys/RouteLLM"
"Bug Tracker" = "https://github.com/lm-sys/RouteLLM/issues"

[tool.pytest.ini_options]
markers = [
	"slow: imports the heavy ML stack or spawns a subprocess",
]

[tool.isort]
profile = "black"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmarks*"]

[tool.wheel]
exclude = ["assets*", "benchmarks*"]
