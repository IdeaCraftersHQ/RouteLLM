[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routellm"
version = "0.2.0"
description = "A framework for serving and evaluating large language model routers."
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
	'pyyaml',
	'pydantic',
	"numpy<2",
	'pandas',
	'torch',
	'scikit-learn',
	'tqdm',
	'openai',
	'transformers',
	'datasets',
	'litellm',
	'x402[evm]>=2.0.0'
]

[project.optional-dependencies]
serve = ["fastapi", "shortuuid", "uvicorn"]
eval = ["matplotlib", "pandarallel", "sglang", 'tiktoken', "psutil"]
dev = [
	"pre-commit",
	"pytest",
	"pytest-asyncio",
	"ruff",
	# Record/replay cassettes for the e2e scenarios. Test-only, and
	# deliberately NOT a core dependency: it requires Python >=3.12
	# while this package supports >=3.11, so putting it in `dependencies`
	# would raise the floor for every consumer to buy a test fixture.
	#
	# The marker is load-bearing, not decoration. Without it a resolver
	# must satisfy the extra across this package's whole declared range,
	# finds 3.11 incompatible with xrr's floor, and fails outright --
	# `make test` cannot even build an environment. With it, 3.11 simply
	# resolves without xrr and those tests skip.
	"hop-top-xrr @ git+https://github.com/hop-top/poly-xrr.git#subdirectory=py ; python_version >= '3.12'",
]
# A direct-URL dependency is rejected by PyPI, so this extra blocks an
# upload of the package. Replace it with a version pin once hop-top-aim
# is published.
pairing = [
	"hop-top-aim @ git+https://github.com/hop-top/poly-aim.git#subdirectory=py",
]
# Only `routellm.quality_scores score` imports fit, and only inside
# `build_scorer`. Aggregation and config consumption never do.
fit = [
	"hop-top-fit @ git+https://github.com/hop-top/fit.git#subdirectory=py",
]

[project.urls]
"Homepage" = "https://github.com/lm-sys/RouteLLM"
"Bug Tracker" = "https://github.com/lm-sys/RouteLLM/issues"

[tool.pytest.ini_options]
markers = [
	"slow: imports the heavy ML stack or spawns a subprocess",
]

[tool.hatch.metadata]
# The `pairing` extra names a git URL. Setuptools allowed it silently;
# hatchling refuses unless this says so. PyPI still rejects such an
# upload, which is what the note on that extra is about.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["routellm"]

[tool.hatch.build.targets.sdist]
exclude = ["assets", "benchmarks", "extensions", "docs", "models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The default rules plus the upgrade, import-hygiene and bugbear sets the
# playbook expects. Judgement-call findings (blind except, subprocess
# without check) are reported but not auto-fixed.
select = ["E", "F", "I", "UP", "B", "RUF", "PL", "BLE"]

# One array, two sections, and the split is the point: a reader should
# be able to tell "wrong for this codebase" from "we have not got to
# it yet" without going digging.
#
# PERMANENT entries come first. Each is a rule whose advice is wrong
# here, and each carries the reason. These are not expected to be
# fixed, and a new one belongs here only with a reason of that kind.
#
# DEBT follows, under its own header, each entry with its count. That
# section is meant to shrink. Ruff has a single ignore list, so the
# two cannot be separate keys; the fence is the convention. Counts are
# from the commit that wrote them and drift as code moves -- `make
# lint` is what settles an argument, not this comment.
ignore = [
	# ---- Permanent: wrong for this codebase ------------------------
	# The eval benchmarks compare pandas Series with `== True`. On a
	# Series that is an elementwise mask, not a truth test, and ruff's
	# suggested `if x:` raises ValueError. Applying the fix would
	# introduce a bug, so this is not a style choice.
	"E712",
	# Heavy and optional dependencies -- torch, the payment SDK, the
	# training stack -- are imported inside the functions that need
	# them, deliberately, so importing routellm stays cheap. (65)
	"PLC0415",

	# ---- Debt: not yet worked through ------------------------------
	# Listed explicitly so `make lint` is green and a NEW violation is
	# visible rather than buried. Each should be retired deliberately.

	# Volume rules. PLR2004 alone is 138 findings and churning them
	# buys nothing; these go last, if ever.
	"PLR2004",  # 138 magic value in comparison
	"E501",     # 21 line too long
	"PLR0913",  # 15 too many arguments
	"PLR0917",  # 12 too many positional arguments

	# Blind except. 30 sites, and most are deliberate: documented
	# best-effort boundaries in the payment, trace-recording, cache,
	# plugin-discovery and provider-fallback paths, where the contract
	# is that they never fail the caller. Retiring this rule means
	# making each of those explicit, not narrowing them wholesale.
	"BLE001",

	# Structural. Real but each is a refactor, not an edit.
	"E402",     # 9 module import not at top of file
	"PLW2901",  # 9 loop variable overwritten
	"PLW0603",  # 8 global statement
	"PLR0912",  # 3 too many branches
	"PLR0915",  # 3 too many statements
	"PLR0911",  # 2 too many return statements

	# Correctness-adjacent, small, and worth doing next.
	"RUF012",   # 8 mutable class default
	"B017",     # 7 assert on bare Exception
	"RUF059",   # 8 unused unpacked variable
	"RUF005",   # 6 collection literal concatenation
	"E741",     # 3 ambiguous variable name
	"B905",     # 3 zip() without explicit strict=
	"F811",     # 2 redefinition -- pytest fixture params, false positive
	"RUF015",   # 2 prefer next(iter(...)) over list slice
	"B007",     # 2 unused loop control variable
	"F841",     # 1 unused local, in the payment suite
	"RUF043",   # 1 pattern passed to re without raw string
	"UP042",    # 1 class inherits from both str and enum
]

[tool.ruff.lint.per-file-ignores]
# All permanent, for the same kind of reason as the block above: each
# rule is answering a question the file has already answered.
#
#   PLC0415  tests import heavy deps inside the test that needs them
#   BLE001   a test that asserts on failure catches broadly on purpose
#   PLW1510  subprocess.run in a test whose returncode is the assertion
#   B018     `controller.model_pair` inside pytest.raises is a property
#            access that must raise; it only looks useless (1 site)
"routellm/tests/*" = ["PLC0415", "BLE001", "PLW1510", "B018"]
# The fallback loop defines a closure and calls it in the same
# iteration, so late binding never bites; B023 cannot see that. (9)
"routellm/controller.py" = ["B023"]
